<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset your NearPill password</title>
  <link rel="stylesheet" href="/recovery/reset-password.css">
  <script src="/recovery/reset-password.js" defer></script>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <p id="status" role="status" aria-live="polite">Choose a new password for NearPill.</p>
    <form id="resetForm">
      <label for="password">New password (6–128 characters)</label>
      <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <button id="submit" type="submit">Update password</button>
    </form>
    <p>Need help? <a href="mailto:nearpillemail@gmail.com">Contact NearPill support</a>.</p>
    <noscript>Enable JavaScript to reset your password, or request help from NearPill support.</noscript>
  </main>
</body>
</html>
